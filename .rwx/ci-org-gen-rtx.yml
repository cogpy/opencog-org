      cd asmoses/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: build-moses
    use:
      - build-cogutil
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf moses
      git clone https://github.com/opencog/moses.git
