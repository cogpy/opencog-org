# RTX workflow for building and installing OpenCog components

on:
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
    pull-request:
      init:
        commit-sha: ${{ event.git.sha }}

base:
  image: opencog/opencog-deps
  config: rwx/base 1.0.2

tasks:
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/cogpy/opencog-org.git
      ref: ${{ init.commit-sha }}
      github-token: ${{ github.token }}

  - key: install-deps
    use:
      - code
    run: |
      apt-get update
      apt-get install -y ccache pkg-config cmake build-essential git

  - key: start-postgres
    use:
      - install-deps
    run: |
      apt-get install -y postgresql postgresql-client
      service postgresql start
      su -c "psql -c \"CREATE USER opencog_test WITH PASSWORD 'cheese';\"" postgres
      su -c "createdb -O opencog_test atomspace_db" postgres

  - key: build-cogutil
    use:
      - install-deps
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf cogutil
      git clone https://github.com/opencog/cogutil.git
      mkdir -p cogutil/build
      cd cogutil/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: build-atomspace
    use:
      - build-cogutil
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf atomspace
      git clone https://github.com/opencog/atomspace.git
      mkdir -p atomspace/build
      cd atomspace/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: build-atomspace-storage
    use:
      - build-atomspace
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf atomspace-storage
      git clone https://github.com/opencog/atomspace-storage.git
      mkdir -p atomspace-storage/build
      cd atomspace-storage/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: build-cogserver
    use:
      - build-atomspace-storage
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf cogserver
      git clone https://github.com/opencog/cogserver.git
      mkdir -p cogserver/build
      cd cogserver/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: build-unify
    use:
      - build-atomspace
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf unify
      git clone https://github.com/opencog/unify.git
      mkdir -p unify/build
      cd unify/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: build-ure
    use:
      - build-unify
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf ure
      git clone https://github.com/opencog/ure.git
      mkdir -p ure/build
      cd ure/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: build-spacetime
    use:
      - build-atomspace
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf spacetime
      git clone https://github.com/opencog/spacetime.git
      mkdir -p spacetime/build
      cd spacetime/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: build-attention
    use:
      - build-cogserver
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf attention
      git clone https://github.com/opencog/attention.git
      mkdir -p attention/build
      cd attention/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: build-miner
    use:
      - build-ure
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf miner
      git clone https://github.com/opencog/miner.git
      mkdir -p miner/build
      cd miner/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
