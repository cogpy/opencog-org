  - key: build-vision
    use:
      - build-atomspace
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf vision
      git clone https://github.com/opencog/vision.git
      mkdir -p vision/build
      cd vision/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: build-benchmark
    use:
      - build-atomspace
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf benchmark
      git clone https://github.com/opencog/benchmark.git
      mkdir -p benchmark/build
      cd benchmark/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: run-tests
    use:
      - build-opencog
      - build-learn
      - build-atomspace-rocks
      - build-atomspace-restful
      - build-pattern-index
      - build-vision
      - build-benchmark
      - build-miner
      - build-asmoses
      - build-moses
      - start-postgres
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      cd cogutil/build && make tests && make check ARGS="-j2" && cd ../..
      cd atomspace/build && make tests && make check ARGS="-j2" && cd ../..
      cd cogserver/build && make tests && make check ARGS="-j2" && cd ../..
      cd unify/build && make tests && make check ARGS="-j2" && cd ../..
      cd ure/build && make tests && make check ARGS="-j2" && cd ../..
      cd spacetime/build && make tests && make check ARGS="-j2" && cd ../..
      cd attention/build && make tests && make check ARGS="-j2" && cd ../..
      cd miner/build && make tests && make check ARGS="-j2" && cd ../..
      cd pln/build && make tests && make check ARGS="-j2" && cd ../..
      cd asmoses/build && make tests && make check ARGS="-j2" && cd ../..
      cd moses/build && make tests && make check ARGS="-j2" && cd ../..
      cd opencog/build && make tests && make check ARGS="-j2" && cd ../..
      cd lg-atomese/build && make tests && make check ARGS="-j2" && cd ../..
      cd learn/build && make tests && make check ARGS="-j2" && cd ../..
      cd atomspace-rocks/build && make tests && make check ARGS="-j2" && cd ../..
      cd atomspace-restful/build && make tests && make check ARGS="-j2" && cd ../..
      cd pattern-index/build && make tests && make check ARGS="-j2" && cd ../..
      cd vision/build && make tests && make check ARGS="-j2" && cd ../..
      cd benchmark/build && make tests && make check ARGS="-j2" && cd ../..
