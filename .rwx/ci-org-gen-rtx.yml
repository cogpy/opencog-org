      ldconfig

  - key: build-pattern-index
    use:
      - build-atomspace
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf pattern-index
      git clone https://github.com/opencog/pattern-index.git
      mkdir -p pattern-index/build
      cd pattern-index/build
