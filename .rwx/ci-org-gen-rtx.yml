      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf atomspace-restful
      git clone https://github.com/opencog/atomspace-restful.git
      mkdir -p atomspace-restful/build
      cd atomspace-restful/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
