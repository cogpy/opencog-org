      - build-attention
      - build-pln
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf opencog
      git clone https://github.com/opencog/opencog.git
      mkdir -p opencog/build
      cd opencog/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: build-lg-atomese
    use:
      - build-atomspace
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf lg-atomese
      git clone https://github.com/opencog/lg-atomese.git
      mkdir -p lg-atomese/build
      cd lg-atomese/build
      cmake -DCMAKE_BUILD_TYPE=Release ..
      make -j2
      make install
      ldconfig

  - key: build-learn
    use:
      - build-lg-atomese
    env:
      CCACHE_DIR: /ws/ccache
      MAKEFLAGS: -j2
    run: |
      rm -rf learn
